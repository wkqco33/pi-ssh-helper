name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check (tests, types, format, package contents)
        run: npm run check
      - name: Upload package manifest
        if: always() && matrix.node == 22
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest artifact
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  contract:
    name: Safety and routing contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # These two files carry the reasons this package exists: one keeps the
      # remote-mutation gate and tool registration intact, the other keeps the
      # pi-helper-core seam working. Run them as their own job so a regression
      # is attributable at a glance instead of buried in the suite.
      - name: Contract enforced
        run: |
          npx tsx --test test/tools.test.ts
          npx tsx --test test/integration.test.ts
