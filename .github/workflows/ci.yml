name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      python_ref:
        description: Python helper branch or commit
        type: string
      ros_ref:
        description: ROS helper branch or commit
        type: string
      rust_ref:
        description: Rust helper branch or commit
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check (tests, types, format, package contents)
        run: npm run check
      - name: Upload package manifest
        if: always() && matrix.node == 22
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest artifact
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  contract:
    name: Safety and routing contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # These two files carry the reasons this package exists: one keeps the
      # remote-mutation gate and tool registration intact, the other keeps the
      # pi-helper-core seam working. Run them as their own job so a regression
      # is attributable at a glance instead of buried in the suite.
      - name: Contract enforced
        run: |
          npx tsx --test test/tools.test.ts
          npx tsx --test test/integration.test.ts

  cross-extension:
    name: Python, ROS, and Rust routing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pi-ssh-helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wkqco33/pi-python-helper
          ref: ${{ inputs.python_ref }}
          path: pi-python-helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wkqco33/pi-ros-helper
          ref: ${{ inputs.ros_ref }}
          path: pi-ros-helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wkqco33/pi-rust-helper
          ref: ${{ inputs.rust_ref }}
          path: pi-rust-helper
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          for helper in pi-ssh-helper pi-python-helper pi-ros-helper pi-rust-helper; do
            npm ci --prefix "$helper"
          done
      - name: Verify routing through fake SSH
        working-directory: pi-ssh-helper
        run: npm run test:cross-extension
